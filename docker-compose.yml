services:
  db-central:
    image: postgres:17
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: "${DB_PASSWORD:-dev}", POSTGRES_DB: central}
    volumes: [central-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 10}

  central:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: central
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-central:5432/central
      DB_USER: app
      DB_PASSWORD: "${DB_PASSWORD:-dev}"
    depends_on: {db-central: {condition: service_healthy}}
    ports: ["8080:8080"]

  db-onboard-1:
    image: postgres:17
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: "${DB_PASSWORD:-dev}", POSTGRES_DB: onboard}
    volumes: [onboard1-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 10}

  onboard-1:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: onboard
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-onboard-1:5432/onboard
      DB_USER: app
      DB_PASSWORD: "${DB_PASSWORD:-dev}"
      CENTRAL_URL: http://central:8080
    depends_on: {db-onboard-1: {condition: service_healthy}}
    ports: ["8082:8080"]   # 8081 zajmuje Metro (React Native)

volumes: {central-data: {}, onboard1-data: {}}